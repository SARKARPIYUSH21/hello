<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sorry</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{
  font-family:'Poppins',sans-serif;
  text-align:center;
  background:linear-gradient(135deg,#ffd6e8,#ffe6f0,#fff0f6);
  min-height:100vh;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.page{
  display:none;
  opacity:0;
  transform:scale(0.9);
  transition:opacity 0.6s ease, transform 0.6s ease;
  background:white;
  border-radius:25px;
  padding:40px 30px;
  box-shadow:0 15px 35px rgba(255,105,150,0.3);
  max-width:450px;
  width:100%;
  position:relative;
  overflow:hidden;
}
.page.active{
  display:block;
  opacity:1;
  transform:scale(1);
}
img{
  width:280px;
  border-radius:20px;
  margin:20px auto;
  display:block;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(-10px);}
}
h1{
  font-family:'Dancing Script',cursive;
  color:#d6336c;
  font-size:32px;
  margin-bottom:10px;
}
button{
  padding:14px 28px;
  font-size:17px;
  border-radius:50px;
  border:none;
  cursor:pointer;
  margin:12px 8px;
  font-weight:600;
  transition:transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
}
button:hover{
  transform:translateY(-3px) scale(1.05);
}
.yes{background:linear-gradient(135deg,#4CAF50,#81C784);color:white;}
.no{background:linear-gradient(135deg,#f44336,#ff8a80);color:white;position:relative;}
#page2{height:380px;}
.heart{
  position:absolute;
  font-size:24px;
  animation:floatUp 4s linear infinite;
  opacity:0.7;
}
@keyframes floatUp{
  0%{transform:translateY(0) rotate(0deg);opacity:0.8;}
  100%{transform:translateY(-600px) rotate(360deg);opacity:0;}
}
</style>
</head>
<body>

<div id="page1" class="page active">
<h1>I am really very sorry SNEHA JI for what I did 💔</h1>
<img src="images/cat1.jpg" alt="cat">
<br>
<button class="yes" onclick="showPage(2)">Next</button>
</div>

<div id="page2" class="page">
<h1>Please maaf kardo mata ji,<br>aur kabhi nahi karunga aisa 🥺</h1>
<button class="yes" onclick="showPage(3)">Haa maaf kiya</button>
<button id="noBtn" class="no" onclick="moveButton()">Nahi karungi maaf</button>
</div>

<div id="page3" class="page">
<h1>Thank you, I really love you ❤️</h1>
<img src="images/cat2.jpg" alt="shy cat">
</div>

<script>
function showPage(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  setTimeout(()=>{
    document.getElementById('page'+n).classList.add('active');
    if(n==3) spawnHearts();
  },150);
}
function moveButton(){
  var btn=document.getElementById('noBtn');
  var page=document.getElementById('page2');
  var maxX=page.clientWidth-btn.offsetWidth-20;
  var maxY=page.clientHeight-btn.offsetHeight-20;
  btn.style.position='absolute';
  btn.style.left=Math.random()*maxX+'px';
  btn.style.top=Math.random()*maxY+'px';
}
function spawnHearts(){
  var page=document.getElementById('page3');
  for(var i=0;i<15;i++){
    var h=document.createElement('div');
    h.className='heart';
    h.innerHTML='❤️';
    h.style.left=Math.random()*100+'%';
    h.style.bottom='-30px';
    h.style.animationDelay=(Math.random()*3)+'s';
    page.appendChild(h);
  }
}
</script>
</body>
</html>
